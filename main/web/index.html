<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNPT Standee F91 - Cấu Hình WiFi</title>
    <style>
        :root {
            --primary: #005aab;
            --primary-dark: #00407a;
            --bg: #f4f7fa;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 16px; }
        .container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); overflow: hidden; height: fit-content; }
        .header { background: linear-gradient(135deg, #005aab 0%, #0080ff 100%); color: white; padding: 24px 20px; text-align: center; }
        .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .content { padding: 20px; }
        .card { background: #fafafa; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
        .status-row:last-child { margin-bottom: 0; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); }
        .checkbox-group { display: flex; align-items: center; margin-bottom: 16px; }
        .checkbox-group input { width: 18px; height: 18px; margin-right: 8px; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; font-size: 14px; cursor: pointer; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: #e0e7ff; color: #3730a3; margin-top: 8px; }
        .wifi-list { max-height: 200px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; background: white; }
        .wifi-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
        .wifi-item:last-child { border-bottom: none; }
        .wifi-item:hover { background: #f0f7ff; }
        .wifi-name { font-size: 14px; font-weight: 500; }
        .wifi-rssi { font-size: 12px; color: var(--text-light); }
        .footer { text-align: center; padding: 16px; font-size: 12px; color: var(--text-light); border-top: 1px solid var(--border); }
        .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VNPT STANDEE F91</h1>
            <p>Cấu Hình Mạng WiFi & Internet</p>
        </div>
        <div class="content">
            <div class="card">
                <div class="status-row">
                    <span>Trạng Thái Mạng:</span>
                    <span id="statusBadge" class="badge badge-warning">Đang kiểm tra...</span>
                </div>
                <div class="status-row">
                    <span>IP Địa Chỉ:</span>
                    <strong id="ipAddress">0.0.0.0</strong>
                </div>
                <div class="status-row">
                    <span>WiFi Đã Nối:</span>
                    <strong id="connectedSSID">Chưa có</strong>
                </div>
            </div>

            <form id="wifiForm" onsubmit="saveConfig(event)">
                <div class="form-group">
                    <label for="ssid">Tên WiFi (SSID)</label>
                    <input type="text" id="ssid" placeholder="Nhập hoặc chọn WiFi bên dưới" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật Khẩu WiFi</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu WiFi">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="useStatic" onchange="toggleStaticFields()">
                    <label for="useStatic">Cấu hình IP Tĩnh (Static IP)</label>
                </div>

                <div id="staticFields" style="display: none;">
                    <div class="form-group">
                        <label for="staticIp">Địa chỉ IP Tĩnh</label>
                        <input type="text" id="staticIp" placeholder="VD: 192.168.1.100">
                    </div>
                    <div class="form-group">
                        <label for="netmask">Subnet Mask</label>
                        <input type="text" id="netmask" placeholder="VD: 255.255.255.0" value="255.255.255.0">
                    </div>
                    <div class="form-group">
                        <label for="gateway">Default Gateway</label>
                        <input type="text" id="gateway" placeholder="VD: 192.168.1.1">
                    </div>
                    <div class="form-group">
                        <label for="dns">DNS Server</label>
                        <input type="text" id="dns" placeholder="VD: 8.8.8.8" value="8.8.8.8">
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn btn-primary">Lưu & Kết Nối WiFi</button>
            </form>

            <button type="button" class="btn btn-secondary" onclick="scanWifi()">🔍 Quét Danh Sách WiFi</button>
            <div id="wifiList" class="wifi-list" style="display: none;"></div>
        </div>
        <div class="footer">
            VNPT Standee Payment Firmware v1.0 © 2026
        </div>
    </div>

    <script>
        function toggleStaticFields() {
            const chk = document.getElementById('useStatic');
            document.getElementById('staticFields').style.display = chk.checked ? 'block' : 'none';
        }

        function fetchStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    const badge = document.getElementById('statusBadge');
                    if (data.connected) {
                        badge.className = 'badge badge-success';
                        badge.innerText = 'ĐÃ KẾT NỐI';
                    } else {
                        badge.className = 'badge badge-danger';
                        badge.innerText = 'CHƯA KẾT NỐI';
                    }
                    document.getElementById('ipAddress').innerText = data.ip || '0.0.0.0';
                    document.getElementById('connectedSSID').innerText = data.ssid || 'Chưa nối';
                    if (data.static_cfg) {
                        document.getElementById('useStatic').checked = data.static_cfg.use_static;
                        document.getElementById('staticIp').value = data.static_cfg.ip || '';
                        document.getElementById('netmask').value = data.static_cfg.netmask || '255.255.255.0';
                        document.getElementById('gateway').value = data.static_cfg.gateway || '';
                        document.getElementById('dns').value = data.static_cfg.dns || '8.8.8.8';
                        toggleStaticFields();
                    }
                })
                .catch(() => {});
        }

        function scanWifi() {
            const list = document.getElementById('wifiList');
            list.style.display = 'block';
            list.innerHTML = '<div style="padding:14px; text-align:center; font-size:13px; color:#666;">⏳ Đang quét danh sách WiFi...</div>';
            
            fetch('/api/scan')
                .then(r => r.json())
                .then(items => {
                    if (!items || items.length === 0) {
                        list.innerHTML = '<div style="padding:14px; text-align:center; font-size:13px; color:#666;">Không tìm thấy WiFi nào xung quanh</div>';
                        return;
                    }
                    let html = '';
                    items.forEach(item => {
                        const sec = item.secure ? '🔒' : '🔓';
                        html += `<div class="wifi-item" onclick="selectWifi('${item.ssid}')">
                            <span class="wifi-name">${sec} ${item.ssid}</span>
                            <span class="wifi-rssi">${item.rssi} dBm</span>
                        </div>`;
                    });
                    list.innerHTML = html;
                })
                .catch(() => {
                    list.innerHTML = '<div style="padding:14px; text-align:center; font-size:13px; color:#ef4444;">Lỗi khi quét WiFi</div>';
                });
        }

        function selectWifi(ssid) {
            document.getElementById('ssid').value = ssid;
            document.getElementById('password').focus();
        }

        function checkConnectionSuccess() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    if (data.connected) {
                        document.querySelector('.content').innerHTML = `
                            <div style="text-align:center; padding:30px 10px;">
                                <div style="font-size:48px; margin-bottom:12px;">✅</div>
                                <h2 style="color:#10b981; font-size:20px; margin-bottom:8px;">Kết Nối WiFi Thành Công!</h2>
                                <p style="font-size:14px; color:#6b7280; margin-bottom:20px;">Địa chỉ IP: <strong>${data.ip}</strong></p>
                                <p style="font-size:13px; color:#9ca3af;">Cửa sổ cài đặt sẽ tự động đóng...</p>
                            </div>`;
                        setTimeout(() => { window.location.href = "/hotspot-detect.html"; }, 1500);
                    } else {
                        setTimeout(checkConnectionSuccess, 1000);
                    }
                })
                .catch(() => setTimeout(checkConnectionSuccess, 1500));
        }

        function saveConfig(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value;
            const use_static = document.getElementById('useStatic').checked;
            const static_ip = document.getElementById('staticIp').value.trim();
            const netmask = document.getElementById('netmask').value.trim();
            const gateway = document.getElementById('gateway').value.trim();
            const dns = document.getElementById('dns').value.trim();

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Đang kết nối WiFi...';

            fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ssid, password,
                    use_static_ip: use_static,
                    static_ip, netmask, gateway, dns
                })
            })
            .then(r => r.json())
            .then(data => {
                checkConnectionSuccess();
            })
            .catch(err => {
                alert('Lỗi gửi cấu hình: ' + err);
                btn.disabled = false;
                btn.innerText = 'Lưu & Kết Nối WiFi';
            });
        }

        fetchStatus();
    </script>
</body>
</html>
